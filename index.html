<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квиз: инновационный менеджмент</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#17211e;--mute:#5d6b66;--line:#d5dcd9;--acc:#0f6b5c;--accbg:#dcefea;--ok:#1b7a3d;--okbg:#dff3e5;--bad:#b3261e;--badbg:#fbe3e0;--warn:#8a5a00;--warnbg:#fff1d6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111816;--card:#1a2421;--ink:#e8efec;--mute:#9aaba5;--line:#2f3d39;--acc:#5fc8b2;--accbg:#173a33;--ok:#6fd48f;--okbg:#17382394;--bad:#ff8b82;--badbg:#411c1990;--warn:#f1c36a;--warnbg:#3d2f0f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111816;--card:#1a2421;--ink:#e8efec;--mute:#9aaba5;--line:#2f3d39;--acc:#5fc8b2;--accbg:#173a33;--ok:#6fd48f;--okbg:#17382394;--bad:#ff8b82;--badbg:#411c1990;--warn:#f1c36a;--warnbg:#3d2f0f;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:24px;line-height:1.2;margin:8px 0 6px}
p.sub{color:var(--mute);margin:0 0 20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mode{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.mode b{display:block;font-size:18px}.mode span{color:var(--mute);font-size:15px}
.mode:disabled{opacity:.5;cursor:default}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.q{font-size:20px;line-height:1.35;margin:18px 0 16px;font-weight:600}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;line-height:1.35}
.opt:not(:disabled):hover{border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:15px;margin:4px 0 12px}
.next,.primary{background:var(--acc);color:var(--bg);border:0;border-radius:12px;padding:14px 18px;width:100%;font-weight:600;margin-top:6px}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:12px 16px;width:100%;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center}
.link{background:none;border:0;color:var(--mute);padding:6px 0;font-size:15px}
.score{font-size:48px;font-weight:700;margin:10px 0 0}
.wrong{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:16px}
.wrong small{color:var(--mute)}.wrong .r{color:var(--ok);font-weight:600;margin-top:4px}
</style></head><body><main id="app"></main>

const $=document.getElementById('app');
let st=null;
const LS='quiz-im-wrong';
function load(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
function save(a){try{localStorage.setItem(LS,JSON.stringify(a))}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function home(){
  const w=load();
  $.innerHTML=`<h1>Инновационный менеджмент</h1><p class="sub">${DATA.length} вопросов. Варианты каждый раз перемешиваются, чтобы не запоминать позицию ответа.</p>
  <button class="mode" data-m="all"><b>Все вопросы по порядку</b><span>Как в файле, с 1 по ${DATA.length}</span></button>
  <button class="mode" data-m="shuf"><b>Все вопросы вперемешку</b><span>Полный круг в случайном порядке</span></button>
  <button class="mode" data-m="r20"><b>Быстрая тренировка</b><span>20 случайных вопросов</span></button>
  <button class="mode" data-m="wrong" ${w.length?'':'disabled'}><b>Работа над ошибками</b><span>${w.length?w.length+' вопр., где вы ошибались':'Пока нет ошибок'}</span></button>`;
  $.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
}
function start(m){
  let L=DATA;
  if(m==='shuf')L=shuffle(DATA);
  if(m==='r20')L=shuffle(DATA).slice(0,20);
  if(m==='wrong'){const w=load();L=shuffle(DATA.filter(d=>w.includes(d.id)))}
  st={L,i:0,score:0,miss:[]};show();
}
function show(){
  const d=st.L[st.i];
  const ord=shuffle(d.o.map((t,k)=>({t,k})));
  const pct=Math.round(st.i/st.L.length*100);
  $.innerHTML=`<div class="top"><button class="link" id="x">← Выйти</button><span class="meta">Верно: ${st.score}</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div><div class="meta"><span>Вопрос ${st.i+1} из ${st.L.length}</span><span>№${d.id} в файле</span></div>
  <div class="q">${esc(d.q)}</div><div id="opts">${ord.map((o,n)=>`<button class="opt" data-k="${o.k}">${esc(o.t)}</button>`).join('')}</div><div id="fb"></div>`;
  document.getElementById('x').onclick=home;
  $.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,d));
}
function answer(b,d){
  const k=+b.dataset.k,w=load();
  document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.k===d.a)o.classList.add('ok')});
  if(k===d.a){st.score++;save(w.filter(x=>x!==d.id))}
  else{b.classList.add('bad');st.miss.push(d);if(!w.includes(d.id))save(w.concat(d.id))}
  const last=st.i===st.L.length-1;
  document.getElementById('fb').innerHTML=(d.low?'<div class="note">Правильный ответ определён с неуверенностью — сверьте с конспектом или преподавателем.</div>':'')+`<button class="next" id="n">${last?'Показать результат':'Дальше'}</button>`;
  const n=document.getElementById('n');n.onclick=()=>{st.i++;last?finish():show()};n.focus();
}
function finish(){
  const t=st.L.length,p=Math.round(st.score/t*100);
  $.innerHTML=`<h1>Результат</h1><div class="score">${st.score} / ${t}</div><p class="sub">${p}% верных ответов</p>
  ${st.miss.length?`<button class="primary" id="re">Повторить ошибки (${st.miss.length})</button>`:''}
  <button class="ghost" id="h">В начало</button>
  ${st.miss.length?'<h2 style="font-size:19px;margin:22px 0 4px">Где ошиблись</h2>'+st.miss.map(d=>`<div class="wrong"><small>№${d.id}</small><div>${esc(d.q)}</div><div class="r">${esc(d.o[d.a])}</div></div>`).join(''):'<p>Ошибок нет.</p>'}`;
  document.getElementById('h').onclick=home;
  const re=document.getElementById('re');
  if(re)re.onclick=()=>{st={L:shuffle(st.miss),i:0,score:0,miss:[]};show()};
  window.scrollTo(0,0);
}
home();
</script></body></html>
